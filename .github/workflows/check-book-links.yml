name: Check official book resources
on:
  push:
    paths:
      - scripts/find-cdc-books.js
      - .github/workflows/check-book-links.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/find-cdc-books.js
